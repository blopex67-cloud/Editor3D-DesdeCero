<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#1b1c1f">
  <title>Editor 3D</title>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button class="brand" id="home"><span class="logo">⬡</span><b>Editor 3D</b></button>
      <button class="mode">Object Mode <span>⌄</span></button>
      <div class="top-actions">
        <button id="undo" title="Deshacer">↶</button>
        <button id="save" title="Guardar">▣</button>
        <button id="importScene" title="Importar escena">⇧</button>
        <button id="exportScene" title="Exportar escena">▧</button>
      </div>
    </header>
    <main class="workspace">
      <nav class="toolbar">
        <button class="tool active" data-tool="select"><span>✥</span><small>Seleccionar</small></button>
        <button class="tool" data-tool="translate"><span>✣</span><small>Mover</small></button>
        <button class="tool" data-tool="rotate"><span>⟳</span><small>Rotar</small></button>
        <button class="tool" data-tool="scale"><span>⤢</span><small>Escalar</small></button>
        <i></i>
        <button class="tool" id="addCube"><span>⬡</span><small>Cubo</small></button>
        <button class="tool" id="addSphere"><span>◉</span><small>Esfera</small></button>
        <button class="tool delete" id="delete"><span>▤</span><small>Borrar</small></button>
      </nav>
      <section class="viewport">
        <div class="view-label"><strong>Object Mode</strong><span id="hint">Arrastra para orbitar · pellizca para acercar</span></div>
        <div id="scene"></div>
        <div class="view-tools"><button id="frame" title="Centrar vista">◎</button><button id="gridToggle" title="Mostrar u ocultar cuadrícula">▦</button></div>
        <div class="toast" id="toast"></div>
      </section>
      <aside class="right-panel">
        <section class="outliner">
          <div class="panel-head">OUTLINER <button id="addMenu">＋</button></div>
          <div class="collection">▾ &nbsp;Scene Collection</div>
          <div id="objectList"></div>
        </section>
        <section class="inspector">
          <div class="panel-head">PROPIEDADES</div>
          <div id="properties" class="properties">Selecciona un objeto</div>
        </section>
      </aside>
    </main>
    <footer><span>Editor 3D</span><span id="status">Listo</span></footer>
    <input id="fileInput" type="file" accept=".json,.glb,.gltf,model/gltf-binary,model/gltf+json" hidden>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>

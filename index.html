<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#292a2c">
  <title>Editor 3D</title>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand-zone">
        <button class="brand" id="home" title="Editor 3D"><span class="logo">⬡</span></button>
        <button id="save" title="Guardar escena">▣</button>
        <button id="importScene" title="Importar escena">▧</button>
        <button id="exportScene" title="Exportar escena">⇧</button>
      </div>
      <button class="mode" id="animMode">Object Mode <span>⌄</span></button>
      <div class="top-actions">
        <button id="undo" title="Deshacer">↶</button>
        <button class="top-select" title="Seleccionar">◉</button>
        <button class="top-hierarchy" title="Jerarquía">☷</button>
      </div>
    </header>
    <main class="workspace">
      <nav class="toolbar" aria-label="Herramientas">
        <button class="tool active" data-tool="select" title="Seleccionar"><span>✥</span><small>Selección</small></button>
        <button class="tool" data-tool="translate" title="Mover"><span>✣</span><small>Mover</small></button>
        <button class="tool" data-tool="rotate" title="Rotar"><span>⟳</span><small>Rotar</small></button>
        <button class="tool" data-tool="scale" title="Escalar"><span>⤢</span><small>Escala</small></button>
        <i></i>
        <button class="tool" id="addCube" title="Añadir cubo"><span>⬡</span><small>Cubo</small></button>
        <button class="tool" id="addSphere" title="Añadir esfera"><span>◉</span><small>Esfera</small></button>
        <button class="tool" id="delete" title="Borrar objeto"><span>▤</span><small>Borrar</small></button>
      </nav>
      <section class="viewport">
        <div class="view-label"><strong>Object Mode</strong><span id="hint">Arrastra para orbitar · pellizca para acercar</span></div>
        <div id="scene"></div>
        <div class="left-overlay"><button title="Mover">✣</button><button title="Girar">⟳</button></div>
        <div class="right-overlay"><button title="Vista cámara">◉</button><button title="Vista escena">◈</button></div>
        <div class="view-tools"><button id="frame" title="Centrar vista">⊙</button><button id="gridToggle" title="Cuadrícula">▦</button><button id="postToggle" title="Postprocesado PBR liviano">RA</button></div>
        <div class="toast" id="toast"></div>
      </section>
      <aside class="right-panel">
        <section class="outliner">
          <div class="panel-tabs"><span>Hierarchy</span><span>Scene</span></div>
          <div class="animation-panel" id="animationPanel" hidden>
            <div class="anim-head"><span>ANIMACIÓN</span><button id="addBoneTrack" title="Añadir pista de hueso">＋ Hueso</button></div>
            <div class="anim-actions"><button id="addKeyframe">◆ Keyframe</button><button id="playAnimation">▶</button></div>
            <div class="timeline-row"><button id="prevFrame">◀</button><input id="frameRange" type="range" min="0" max="120" value="0"><button id="nextFrame">▶</button></div>
            <div class="frame-label"><span>Fotograma</span><input id="frameNumber" type="number" min="0" max="120" value="0"></div>
            <div class="bone-list" id="boneList">Carga un modelo con armature</div>
          </div>
          <div class="collection">▾ &nbsp;Scene Collection</div>
          <div id="objectList"></div>
        </section>
        <section class="inspector">
          <div class="panel-head">PROPIEDADES</div>
          <div id="properties" class="properties">Selecciona un objeto</div>
        </section>
      </aside>
    </main>
    <footer><span>Editor 3D</span><span id="status">Listo</span></footer>
    <input id="fileInput" type="file" accept=".json,.glb,.gltf,model/gltf-binary,model/gltf+json" hidden>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>

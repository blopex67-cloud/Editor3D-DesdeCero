name: Build Editor 3D Android APK

on:
  workflow_dispatch:
    inputs:
      note:
        description: Build note
        required: false
        default: Manual APK build

permissions:
  contents: read

concurrency:
  group: editor3d-from-scratch
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install dependencies and build web app
        run: |
          npm install
          npm run build

      - name: Generate Android project and compile APK
        run: |
          npx cap add android
          npx cap sync android
          python3 scripts/patch_android.py
          python3 scripts/brand_android.py
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('android/app/src/main/AndroidManifest.xml')
          text = path.read_text()
          pattern = re.compile(r'<activity\b(?=[^>]*android:name="[^"]*MainActivity")[^>]*>', re.S)
          match = pattern.search(text)
          if not match:
              raise SystemExit('MainActivity not found in generated Android manifest')
          tag = match.group(0)
          if re.search(r'android:screenOrientation="[^"]*"', tag):
              tag = re.sub(r'android:screenOrientation="[^"]*"', 'android:screenOrientation="landscape"', tag)
          else:
              tag = tag[:-1] + ' android:screenOrientation="landscape">'
          if re.search(r'android:configChanges="[^"]*"', tag):
              tag = re.sub(r'android:configChanges="[^"]*"', 'android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode"', tag)
          else:
              tag = tag[:-1] + ' android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode">'
          text = text[:match.start()] + tag + text[match.end():]
          path.write_text(text)
          if 'android:screenOrientation="landscape"' not in tag:
              raise SystemExit('Could not verify landscape orientation')
          app_pattern = re.compile(r'<application\b[^>]*>', re.S)
          app_match = app_pattern.search(text)
          if not app_match:
              raise SystemExit('Application element not found in Android manifest')
          app_tag = app_match.group(0)
          if re.search(r'android:largeHeap="[^"]*"', app_tag):
              app_tag = re.sub(r'android:largeHeap="[^"]*"', 'android:largeHeap="true"', app_tag)
          else:
              app_tag = app_tag[:-1] + ' android:largeHeap="true">'
          text = text[:app_match.start()] + app_tag + text[app_match.end():]
          path.write_text(text)
          if 'android:largeHeap="true"' not in app_tag:
              raise SystemExit('Could not verify large heap configuration')
          print('Verified landscape and larger available heap for large model imports')
          PY
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Verify APK exists
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          sha256sum "$APK" | tee android/app/build/outputs/apk/debug/sha256.txt
          file "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt -print -quit)"
          test -n "$AAPT"
          "$AAPT" dump badging "$APK" | tee android/app/build/outputs/apk/debug/apk-badging.txt
          grep -F "uses-implied-feature: name='android.hardware.screen.landscape'" android/app/build/outputs/apk/debug/apk-badging.txt

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Editor3D-DesdeCero-debug-APK
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/sha256.txt
          if-no-files-found: error
          retention-days: 14

name: Build Editor 3D Android APK

on:
  workflow_dispatch:
    inputs:
      note:
        description: Build note
        required: false
        default: Manual APK build

permissions:
  contents: read

concurrency:
  group: editor3d-from-scratch
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          packages: platform-tools

      - name: Install Android platform and build tools
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/12.0/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platforms;android-35"
          "$SDKMANAGER" "build-tools;35.0.0"

      - name: Install dependencies and build web app
        run: |
          npm install
          npm run build

      - name: Generate Android project and compile APK
        run: |
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Verify APK exists
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          sha256sum "$APK" | tee android/app/build/outputs/apk/debug/sha256.txt
          file "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Editor3D-DesdeCero-debug-APK
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/sha256.txt
          if-no-files-found: error
          retention-days: 14

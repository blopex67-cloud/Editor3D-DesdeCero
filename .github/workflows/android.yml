name: Build Editor 3D Android APK

on:
  workflow_dispatch:
    inputs:
      note:
        description: Build note
        required: false
        default: Manual APK build

permissions:
  contents: read

concurrency:
  group: editor3d-from-scratch
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install dependencies and build web app
        run: |
          npm install
          npm run build

      - name: Generate Android project and compile APK
        run: |
          npx cap add android
          npx cap sync android
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          path = Path('android/app/src/main/AndroidManifest.xml')
          tree = ET.parse(path)
          root = tree.getroot()
          ns = '{http://schemas.android.com/apk/res/android}'
          activity = next((e for e in root.findall('application/activity') if e.attrib.get(ns+'name','').endswith('MainActivity')), None)
          if activity is None:
              raise SystemExit('MainActivity not found in generated Android manifest')
          activity.set(ns+'screenOrientation', 'landscape')
          activity.set(ns+'configChanges', 'orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode')
          tree.write(path, encoding='utf-8', xml_declaration=True)
          checked = ET.parse(path).getroot().find('application/activity')
          assert checked is not None and checked.attrib.get(ns+'screenOrientation') == 'landscape'
          print('Verified MainActivity orientation: landscape')
          PY
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Verify APK exists
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          sha256sum "$APK" | tee android/app/build/outputs/apk/debug/sha256.txt
          file "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt -print -quit)"
          test -n "$AAPT"
          "$AAPT" dump badging "$APK" | tee android/app/build/outputs/apk/debug/apk-badging.txt
          grep -E "screenOrientation='landscape'" android/app/build/outputs/apk/debug/apk-badging.txt

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Editor3D-DesdeCero-debug-APK
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/sha256.txt
          if-no-files-found: error
          retention-days: 14
